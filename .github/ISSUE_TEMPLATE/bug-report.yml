name: Bug report
description: Report a reproducible problem in the Bedrock or SageMaker specialization
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove AWS identifiers, credentials, service passwords, private endpoints, and repository secrets before submitting. Use the private security advisory form for a suspected vulnerability.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Build or offline installer
        - Doctor or AWS verification
        - Service start, stop, or recovery
        - Basic agent task or approval
        - Terminal chat
        - Workspace sandbox
        - Native OpenCode session transport
        - Documentation
        - Other fork-specific behavior
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: Commit or artifact version
      placeholder: 40-character commit or version from manifest.json
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Linux distribution, architecture, Python version, and SageMaker application type if applicable.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Enter ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted logs
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed AWS identifiers, credentials, passwords, private endpoints, and repository secrets.
          required: true
        - label: I checked whether the problem also occurs in unmodified OpenCode.
          required: true
